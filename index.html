<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연우 말 카드</title>
<meta name="description" content="영어로 바로 안 나오던 한국어 표현을 말로 담아두고 카드로 복습하는 앱">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연우 말 카드">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --bg:#EEF1F3; --card:#FCFDFE; --card-2:#E5EAEE; --ink:#16212B; --ink-2:#43535F;
  --muted:#77868F; --line:#D5DDE2; --line-soft:#E4E9ED;
  --accent:#1D5470; --accent-soft:#DCE7EE; --on-accent:#FFFFFF;
  --warm:#B0512A; --warm-soft:#F2E2D9; --on-warm:#FFFFFF;
  --ok:#2E6B52; --ok-soft:#DCEAE2;
  --f-ui:"Gothic A1",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-sp:"Gowun Batang",Georgia,"Nanum Myeongjo",serif;
  --f-mo:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181C; --card:#192127; --card-2:#232D34; --ink:#E7EDF1; --ink-2:#AEBCC4;
    --muted:#85949C; --line:#2C373E; --line-soft:#232C32;
    --accent:#79B7D8; --accent-soft:#16303D; --on-accent:#0E1418;
    --warm:#E28E62; --warm-soft:#33241B; --on-warm:#22160F;
    --ok:#79C4A0; --ok-soft:#163024;
  }
}
:root[data-theme="dark"]{
  --bg:#12181C; --card:#192127; --card-2:#232D34; --ink:#E7EDF1; --ink-2:#AEBCC4;
  --muted:#85949C; --line:#2C373E; --line-soft:#232C32;
  --accent:#79B7D8; --accent-soft:#16303D; --on-accent:#0E1418;
  --warm:#E28E62; --warm-soft:#33241B; --on-warm:#22160F;
  --ok:#79C4A0; --ok-soft:#163024;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased; word-break:keep-all;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font-family:inherit; font-size:inherit; cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.app{max-width:560px; margin:0 auto; padding:0 16px}

.top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(20px + env(safe-area-inset-top)) 0 16px;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0}
.brand h1{margin:0; font-family:var(--f-sp); font-weight:700; font-size:21px; line-height:1.3; letter-spacing:-0.01em}
.brand .sub{font-size:12.5px; color:var(--muted); line-height:1.4}
.who{display:flex; border:1px solid var(--line); border-radius:999px; background:var(--card); overflow:hidden; flex:none}
.who button{border:0; background:transparent; color:var(--muted); padding:6px 13px; font-size:13px; font-weight:500}
.who button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.banner{
  display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line);
  background:var(--card); border-radius:10px; padding:12px 14px;
  font-size:13.5px; line-height:1.6; color:var(--ink-2); margin-bottom:14px;
}
.banner.warn{border-color:var(--warm); background:var(--warm-soft); color:var(--ink)}
.banner b{color:var(--ink)}

.panel{display:flex; flex-direction:column; gap:16px; padding-bottom:24px}
.sheet{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 16px; display:flex; flex-direction:column; gap:14px}
.sheet h2{margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em}
.hint{font-size:13px; line-height:1.6; color:var(--muted); margin:0}

label.fld,.fld{display:flex; flex-direction:column; gap:7px}
.lb{font-size:12px; font-weight:600; letter-spacing:.01em; color:var(--muted)}
textarea,input[type=text]{
  width:100%; font-family:var(--f-ui); font-size:16.5px; line-height:1.6; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 13px; resize:vertical;
}
textarea::placeholder,input::placeholder{color:var(--muted)}
textarea{min-height:78px}
textarea.listening{border-color:var(--warm); background:var(--warm-soft)}
textarea.mono{font-family:var(--f-mo); font-size:12.5px; min-height:110px}

.mic{
  width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-radius:12px; padding:15px 16px; font-size:16px; font-weight:700; letter-spacing:-0.01em;
}
.mic svg{width:21px; height:21px; flex:none}
.mic[data-on="1"]{background:var(--warm); border-color:var(--warm); color:var(--on-warm)}
.mic .dot{width:9px; height:9px; border-radius:50%; background:currentColor; flex:none; animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.72)}}
.mic-hint{margin:0; font-size:12.5px; line-height:1.6; color:var(--muted); text-align:center}

.tags{display:flex; flex-wrap:wrap; gap:7px}
.tag{border:1px solid var(--line); background:var(--bg); color:var(--ink-2); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:500}
.tag[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent)}

.cta{border:0; border-radius:11px; background:var(--warm); color:var(--on-warm); padding:14px; font-size:16px; font-weight:700; letter-spacing:-0.01em; width:100%}
.cta[disabled]{opacity:.45; cursor:default}
.ghost{border:1px solid var(--line); background:var(--card); color:var(--ink-2); border-radius:10px; padding:11px 14px; font-size:14px; font-weight:500}
.ghost.full{width:100%}
.ghost.accent{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}

.recent{display:flex; flex-direction:column; gap:8px}
.recent .r{display:flex; align-items:baseline; gap:10px; padding:11px 13px; background:var(--bg); border:1px solid var(--line); border-radius:10px}
.recent .r .ko{font-family:var(--f-sp); font-size:15.5px; flex:1; min-width:0}
.pill{font-family:var(--f-mo); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:3px 7px; border-radius:4px; white-space:nowrap; flex:none}
.pill.wait{background:var(--warm-soft); color:var(--warm)}
.pill.done{background:var(--ok-soft); color:var(--ok)}
.pill.sit{background:var(--card-2); color:var(--ink-2)}

.progress{display:flex; align-items:center; justify-content:space-between; gap:12px}
.progress .n{font-family:var(--f-mo); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.pbar{flex:1; height:3px; background:var(--card-2); border-radius:2px; overflow:hidden}
.pbar i{display:block; height:100%; background:var(--accent); transition:width .3s ease}

.flip{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px 20px;
  display:flex; flex-direction:column; gap:18px; text-align:center; min-height:230px; justify-content:center; width:100%; color:inherit}
.flip .ko{font-family:var(--f-sp); font-weight:700; font-size:clamp(24px,7vw,30px); line-height:1.4; letter-spacing:-0.01em}
.flip .note{font-size:14px; color:var(--muted); line-height:1.6}
.flip .turn{font-size:12.5px; font-weight:600; color:var(--accent)}
.flip .sit-line{display:flex; justify-content:center}

.back-wrap{background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.back{display:flex; flex-direction:column; text-align:left}
.back .ask{padding:14px 20px 0; text-align:center; font-family:var(--f-sp); font-size:15px; color:var(--muted); line-height:1.5}
.back .en{font-family:var(--f-sp); font-weight:700; font-size:clamp(20px,5.6vw,25px); line-height:1.45; color:var(--accent); padding:8px 20px 20px; text-align:center}
.back .blk{padding:16px 20px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:6px}
.back .blk p{margin:0; font-size:14.5px; line-height:1.75; color:var(--ink-2)}
.back .blk p.ex-en{font-family:var(--f-sp); font-size:16px; color:var(--ink); line-height:1.6}

.judge{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.judge button{border-radius:11px; padding:14px 10px; font-size:15px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--ink-2)}
.judge button.yes{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.empty{background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:34px 20px; text-align:center; display:flex; flex-direction:column; gap:8px}
.empty .big{font-family:var(--f-sp); font-size:18px; font-weight:700}
.empty p{margin:0; font-size:14px; color:var(--muted); line-height:1.65}

.list{display:flex; flex-direction:column; gap:9px}
.item{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 15px; display:flex; flex-direction:column; gap:9px}
.item .hd{all:unset; display:flex; align-items:baseline; gap:9px; cursor:pointer; width:100%}
.item .ko{font-family:var(--f-sp); font-size:17px; font-weight:700; flex:1; min-width:0; line-height:1.45}
.item .en{font-size:14.5px; color:var(--accent); line-height:1.55}
.item .meta{font-family:var(--f-mo); font-size:10.5px; color:var(--muted); letter-spacing:.04em}
.item .det{display:flex; flex-direction:column; gap:12px; border-top:1px solid var(--line-soft); padding-top:12px}
.item .det .lb{display:block; margin-bottom:3px}
.item .det p{margin:0; font-size:14px; line-height:1.72; color:var(--ink-2)}
.item .det p.ex-en{font-family:var(--f-sp); font-size:15.5px; color:var(--ink)}
.del{align-self:flex-start; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:8px; padding:6px 11px; font-size:12.5px}

.code{
  font-family:var(--f-mo); font-size:17px; letter-spacing:.06em; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:10px;
  padding:13px; text-align:center; word-break:break-all; user-select:all;
}
.status{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2)}
.status .led{width:8px; height:8px; border-radius:50%; flex:none; background:var(--muted)}
.status .led.on{background:var(--ok)}
.status .led.off{background:var(--warm)}
.rowbtns{display:grid; grid-template-columns:1fr 1fr; gap:9px}

nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--card); border-top:1px solid var(--line);
  padding:6px 0 max(6px, env(safe-area-inset-bottom));
  backdrop-filter:saturate(1.4) blur(6px);
}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:0 10px}
nav button{border:0; background:transparent; color:var(--muted); border-radius:10px; padding:9px 2px 8px;
  display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12.5px; font-weight:600}
nav button[aria-selected="true"]{color:var(--accent); background:var(--accent-soft)}
nav .cnt{font-family:var(--f-mo); font-size:10px; font-variant-numeric:tabular-nums; letter-spacing:.03em; opacity:.85}

.toast{position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:500;
  z-index:40; max-width:90vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .22s ease}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>
  <div class="app" id="root"></div>
  <nav><div class="nav-in" id="nav" role="tablist"></div></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
